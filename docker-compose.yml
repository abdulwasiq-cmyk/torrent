services:
  app:
    build: .
    container_name: torrent-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - QBIT_HOST=qbittorrent
      - QBIT_PORT=8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=adminadmin
      - QBIT_AUTH_ENABLED=true
      - DOWNLOAD_DIR=/downloads
    depends_on:
      - qbittorrent
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ./downloads:/downloads
      - /app/node_modules
    command: sh -lc "npm install && npm run dev"

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: torrent-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
      - WEBUI_USERNAME=admin
      - WEBUI_PASSWORD=adminadmin
      - TORRENTING_PORT=6881
    volumes:
      - ./downloads:/downloads
      - ./qbittorrent/config:/config
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
